[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firecast-ai"
version = "0.1.0"
description = "Explainable multimodal wildfire intelligence research system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tabular = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2", "optuna>=3.5", "shap>=0.44"]
vision = ["torch>=2.2", "torchvision>=0.17", "ultralytics>=8.2", "opencv-python>=4.9", "albumentations>=1.4", "pillow>=10.0"]
deployment = ["onnx>=1.16", "onnxruntime>=1.17"]
ingest = ["paho-mqtt>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["firecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
